services:
  postgres:
    image: postgres:16-alpine
    container_name: ueba-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ueba_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ueba_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-ueba_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ueba_admin} -d ${POSTGRES_DB:-ueba_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ueba-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ueba-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ueba_admin}:${POSTGRES_PASSWORD:-ueba_secret_2024}@postgres:5432/${POSTGRES_DB:-ueba_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-ueba-jwt-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-0.40}
      ML_WEIGHT: ${ML_WEIGHT:-0.7}
      RULE_WEIGHT: ${RULE_WEIGHT:-0.3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - model_data:/app/models

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: ueba-simulator
    environment:
      SIMULATOR_API_URL: http://backend:8000
      SIMULATOR_INTERVAL_MS: ${SIMULATOR_INTERVAL_MS:-3500}
      SIMULATOR_USER_COUNT: ${SIMULATOR_USER_COUNT:-150}
    depends_on:
      backend:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ueba-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8000
      VITE_WS_URL: ws://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  model_data:
